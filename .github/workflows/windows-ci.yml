name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          $gitPath = (Get-Command git.exe).Source
          .\test.ps1 -GitPath $gitPath
      - name: Upload portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OneEsConfigExporter-windows
          path: |
            dist/OneCConfigExporter.exe
            dist/README.md
            dist/UsageGuide.md
          if-no-files-found: error
          retention-days: 14
